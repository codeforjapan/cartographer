name: Deploy (Reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: 'Deployment target: staging or production'
        required: true
        type: string
      colmena_target:
        description: 'Colmena target name'
        required: true
        type: string
      server_ip:
        description: 'Target server IP for SSH'
        required: true
        type: string
      env_file_name:
        description: 'Name of the env file to create (.env.staging or .env.production)'
        required: true
        type: string
    secrets:
      DEPLOY_SSH_KEY:
        required: true
      ENV_FILE_CONTENT:
        required: true
        description: 'Full content of .env file for the target environment'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        with:
          name: kotto5
        continue-on-error: true

      - name: Create env file from secrets
        run: |
          echo "${{ secrets.ENV_FILE_CONTENT }}" > ${{ inputs.env_file_name }}
          echo "✓ Created ${{ inputs.env_file_name }}"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ inputs.server_ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy to ${{ inputs.environment }}
        run: |
          echo "🚀 Deploying to ${{ inputs.environment }}"
          nix run github:zhaofengli/colmena -- apply \
            --impure \
            --on ${{ inputs.colmena_target }} \
            --verbose
        env:
          NIX_SSHOPTS: "-i ~/.ssh/id_ed25519"
