name: Build and Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'  # Release tags trigger production deployment
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy after build'
        required: false
        default: false
        type: boolean
      target:
        description: 'Deploy target'
        required: false
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  deploy-staging:
    # Deploy to staging: main branch push OR manual with target=staging
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.target == 'staging')
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: staging
      colmena_target: cartographer-staging
      server_ip: '3.113.176.251'
      env_file_name: '.env.staging'
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      ENV_FILE_CONTENT: ${{ secrets.ENV_STAGING }}
      ORIGIN_CERT_PEM: ${{ secrets.ORIGIN_CERT_PEM }}
      ORIGIN_KEY_PEM: ${{ secrets.ORIGIN_KEY_PEM }}

  deploy-production:
    # Deploy to production: v* tag push OR manual with target=production
    if: |
      (startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy == true && inputs.target == 'production')
    uses: ./.github/workflows/deploy-reusable.yml
    with:
      environment: production
      colmena_target: cartographer-prod
      server_ip: '13.192.44.10'
      env_file_name: '.env.production'
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      ENV_FILE_CONTENT: ${{ secrets.ENV_PRODUCTION }}
      ORIGIN_CERT_PEM: ${{ secrets.ORIGIN_CERT_PEM }}
      ORIGIN_KEY_PEM: ${{ secrets.ORIGIN_KEY_PEM }}
