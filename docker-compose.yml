services:
  # ---------------------------------------------------------------------------
  # PostgreSQL (Supabase互換)
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "54322:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init-supabase-roles.sql:/docker-entrypoint-initdb.d/00-init-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # DB Migration (SQLファイルを適用)
  # ---------------------------------------------------------------------------
  db-migrate:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./supabase/migrations:/migrations:ro
    entrypoint: >
      sh -c '
        for f in /migrations/*.sql; do
          echo "Applying $$f ..."
          psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DB} -f "$$f"
        done
        echo "Migrations applied successfully"
      '

  # ---------------------------------------------------------------------------
  # PostgREST (Supabase REST API)
  # ---------------------------------------------------------------------------
  supabase-rest:
    image: postgrest/postgrest:v12.2.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgresql://authenticator:postgres@db:5432/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # ---------------------------------------------------------------------------
  # Supabase API Gateway (nginx)
  # Supabase JS クライアントが期待する /rest/v1/ パスを PostgREST にルーティング
  # ---------------------------------------------------------------------------
  supabase-gateway:
    image: nginx:alpine
    ports:
      - "54321:8000"
    volumes:
      - ./infra/docker/supabase-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - supabase-rest

  # ---------------------------------------------------------------------------
  # Haskell Backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      # ボリュームマウント先の中にサブディレクトリを指定する。
      # project-m36 は CrashSafePersistence で createDirectory を呼ぶため、
      # マウントポイント自体を渡すと "already exists" エラーになる。
      M36_DATA_PATH: /app/m36-volume/data
    volumes:
      - m36data:/app/m36-volume
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Next.js Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      # コンテナ間通信では "supabase-gateway" をホスト名として使用
      NEXT_PUBLIC_SUPABASE_URL: http://supabase-gateway:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      HASKELL_BACKEND_URL: ${HASKELL_BACKEND_URL}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    volumes:
      # ソースマウントでホットリロード有効
      - ./app:/app/app
      - ./public:/app/public
      - ./next.config.ts:/app/next.config.ts
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./tsconfig.json:/app/tsconfig.json
    depends_on:
      - backend
      - supabase-gateway

volumes:
  pgdata:
  m36data:
