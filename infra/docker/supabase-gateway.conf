server {
    listen 8000;

    # PostgREST (REST API)
    location /rest/v1/ {
        proxy_pass http://supabase-rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # CORS headers for browser access
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
        add_header Access-Control-Allow-Headers 'Authorization, apikey, Content-Type, X-Client-Info' always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }
    }

    # GoTrue (Auth) - stub: returns 501 for local dev
    location /auth/v1/ {
        return 501 '{"error":"Auth service not available in minimal Docker dev setup"}';
        add_header Content-Type application/json always;
    }

    # Health check
    location /health {
        return 200 'ok';
        add_header Content-Type text/plain always;
    }
}
